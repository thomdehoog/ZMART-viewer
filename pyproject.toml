[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zmart-viewer"
version = "0.2.1"
description = "A viewer for large, growing, multi-channel microscopy images: point it at a folder and it draws what is there, and follows it while a microscope writes."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]

# What every part of this repository needs. The ZMART viewer itself
# (``zmart_viewer``) also needs zarr and pywebview, which are the ``viewer``
# extra below: ``pip install .[viewer]``, or the conda environment, which
# carries both. The mesoSPIM view (``mesospim_view``) needs only this.
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
viewer = [
    "zarr>=3,<4",
    "pywebview>=5",
]
dev = [
    "pytest>=8",
    "pytest-timeout>=2",
    "pytest-cov>=5",
    "ruff>=0.6",
    "playwright>=1.58,<2",
    "pillow>=10",
    "ngff-zarr[validate]>=0.41",
]

[tool.setuptools]
packages = ["zmart_viewer", "zmart_viewer.record", "mesospim_view"]

[tool.setuptools.package-data]
# The built neuroglancer page of the mesoSPIM view (app/mesospim builds into it).
mesospim_view = ["page/*", "page/assets/*"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
    "build",
    "dist",
    ".venv",
    ".eggs",
    "**/__pycache__",
    # Generated, not written.
    "app/page/dist",
    "app/page/node_modules",
    "mesospim_view/page",
    "app/mesospim/node_modules",
    # Roads explored and not taken. Kept for the reasoning, not held to the
    # standards of code anybody runs.
    "parked",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
# A test that sits still is failed with a stack trace, never waited on.
# The slowest honest tests (storms, replays) finish well inside this.
timeout = 600
